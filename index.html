<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Internship & Classroom Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .app-height {
            height: 100vh;
            height: 100dvh;
        }
    </style>
</head>
<body class="text-slate-800 app-height flex justify-center items-center select-none overflow-hidden sm:p-4">

    <!-- MAIN APP CONTAINER -->
    <div class="w-full max-w-md sm:max-w-5xl h-full sm:h-[94vh] sm:max-h-[880px] bg-slate-50 sm:rounded-[32px] sm:shadow-2xl sm:border sm:border-slate-200/80 overflow-hidden flex flex-col relative">

        <!-- AUTHENTICATION SCREEN -->
        <div id="authScreen" class="flex-1 flex flex-col justify-between p-6 sm:p-10 overflow-y-auto bg-gradient-to-b from-emerald-50/70 via-slate-50 to-white">
            <div></div>

            <div class="w-full max-w-sm mx-auto">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-emerald-600/20">
                        <i class="fa-solid fa-graduation-cap text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Internship Portal</h2>
                    <p class="text-xs font-medium text-slate-500 mt-1">Connect directly with your Teacher</p>
                </div>

                <!-- Role Selector Tabs -->
                <div class="flex bg-slate-200/70 p-1 rounded-2xl mb-6">
                    <button id="tabStudent" onclick="switchAuthTab('student')" class="flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm">
                        <i class="fa-solid fa-user-graduate mr-1"></i> Student
                    </button>
                    <button id="tabTeacher" onclick="switchAuthTab('teacher')" class="flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 text-slate-500">
                        <i class="fa-solid fa-chalkboard-user mr-1"></i> Teacher
                    </button>
                </div>

                <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    <div id="nameGroup">
                        <label class="block text-xs font-semibold text-slate-600 mb-1 ml-1">Full Name</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="authName" placeholder="Enter your full name" class="w-full bg-white border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 rounded-2xl pl-11 pr-4 py-3.5 text-sm text-slate-800 placeholder-slate-400 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label id="pinLabel" class="block text-xs font-semibold text-slate-600 mb-1 ml-1">4-Digit Security PIN</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="password" id="authPin" maxlength="4" placeholder="••••" class="w-full bg-white border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 rounded-2xl pl-11 pr-4 py-3.5 text-sm text-slate-800 placeholder-slate-400 outline-none tracking-widest transition">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/20 active:scale-[0.98] transition duration-200 text-sm mt-3 flex items-center justify-center gap-2">
                        <span>Enter Portal</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>

            <div id="authNotice" class="text-center text-[11px] text-slate-400 font-medium py-2">
                New students are automatically registered on first login.
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="mainDashboard" class="flex-1 flex flex-col hidden h-full overflow-hidden">
            
            <!-- TOP APP BAR -->
            <header class="h-16 border-b border-slate-200/80 bg-white px-3 sm:px-5 flex items-center justify-between shrink-0 shadow-xs z-20">
                
                <div class="flex items-center gap-2 sm:gap-3">
                    <!-- SHUTDOWN / LOGOUT BUTTON -->
                    <button onclick="handleLogout()" title="Log Out" class="w-10 h-10 rounded-2xl bg-red-50 hover:bg-red-500 hover:text-white border border-red-200/80 text-red-500 flex items-center justify-center transition active:scale-90 group shrink-0">
                        <i class="fa-solid fa-power-off text-base group-hover:rotate-12 transition-transform duration-200"></i>
                    </button>

                    <button id="mobileBackBtn" onclick="toggleMobileSidebar()" class="sm:hidden w-10 h-10 rounded-2xl bg-slate-100 text-slate-600 flex items-center justify-center hidden">
                        <i class="fa-solid fa-users text-sm"></i>
                    </button>

                    <div class="h-5 w-[1px] bg-slate-200"></div>

                    <div class="flex items-center gap-2">
                        <div class="w-9 h-9 rounded-full bg-emerald-100 border border-emerald-300 text-emerald-700 flex items-center justify-center text-xs font-bold shrink-0">
                            <i id="navRoleIcon" class="fa-solid fa-user-graduate"></i>
                        </div>
                        <div class="leading-tight truncate max-w-[120px] sm:max-w-[180px]">
                            <h1 id="navUserName" class="text-xs sm:text-sm font-bold text-slate-900 truncate">User</h1>
                            <p id="navUserRole" class="text-[10px] font-medium text-slate-500 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Student
                            </p>
                        </div>
                    </div>
                </div>

                <div id="syncBadge" class="px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200/60 text-[10px] font-semibold text-emerald-700 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="syncText">Connected</span>
                </div>
            </header>

            <!-- WORKSPACE PANEL -->
            <div class="flex-1 flex overflow-hidden relative">

                <!-- SIDEBAR (FOR TEACHER) -->
                <aside id="teacherSidebar" class="absolute inset-0 z-30 bg-white sm:relative sm:z-0 w-full sm:w-72 md:w-80 border-r border-slate-200 flex flex-col hidden sm:flex">
                    <div class="p-3.5 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-users text-emerald-600"></i> Registered Students
                        </span>
                        <button onclick="loadRemoteData()" title="Refresh" class="text-slate-400 hover:text-slate-700 text-xs p-1">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>

                    <div id="studentListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                        <!-- Student List -->
                    </div>
                </aside>

                <!-- CHAT MESSAGING MAIN BODY -->
                <main class="flex-1 flex flex-col bg-[#f8fafc] relative w-full overflow-hidden">
                    
                    <!-- CHAT HEADER BANNER -->
                    <div id="chatHeader" class="p-3 px-4 border-b border-slate-200/80 bg-white flex items-center justify-between shrink-0">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-emerald-600 text-white flex items-center justify-center text-sm shadow-md shadow-emerald-600/20 shrink-0">
                                <i id="chatHeaderIcon" class="fa-solid fa-chalkboard-user"></i>
                            </div>
                            <div>
                                <h3 id="chatHeaderTitle" class="text-xs sm:text-sm font-bold text-slate-900 leading-tight">Teacher</h3>
                                <p id="chatHeaderSubtitle" class="text-[10px] text-slate-500 font-medium">Online | Direct Internship Channel</p>
                            </div>
                        </div>

                        <!-- TEACHER QUICK TEMPLATES TOGGLE BUTTON -->
                        <button id="teacherTemplatesBtn" onclick="toggleTeacherQuickDrawer()" class="hidden text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-xl font-semibold hover:bg-emerald-100 flex items-center gap-1.5">
                            <i class="fa-solid fa-list-check"></i> FAQ Quick Sends
                        </button>
                    </div>

                    <!-- TEACHER CATEGORIZED QUICK RESPONSES DRAWER -->
                    <div id="teacherQuickDrawer" class="hidden border-b border-slate-200 bg-emerald-50/90 p-3 overflow-y-auto max-h-60 custom-scrollbar shrink-0">
                        <div class="text-[11px] font-bold text-emerald-900 mb-2 flex items-center justify-between">
                            <span><i class="fa-solid fa-bolt mr-1"></i> Tap Any Question/Reply to Send to Student:</span>
                            <span class="text-[10px] text-emerald-700 font-normal">10 Categorized Lists</span>
                        </div>
                        <div id="teacherCategoryButtons" class="space-y-3">
                            <!-- Populated dynamically from FAQ data -->
                        </div>
                    </div>

                    <!-- MESSAGES FEED -->
                    <div id="messagesContainer" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3 custom-scrollbar">
                        <!-- Messages dynamically render here -->
                    </div>

                    <!-- STUDENT QUICK ESSENTIAL MESSAGES DRAWER -->
                    <div id="predefinedChatBar" class="p-2 px-3 border-t border-slate-200/80 bg-white overflow-x-auto flex items-center gap-2 shrink-0 custom-scrollbar">
                        <span class="text-[10px] font-bold text-emerald-700 whitespace-nowrap flex items-center gap-1 mr-0.5">
                            <i class="fa-solid fa-bolt"></i> Quick Send:
                        </span>
                        <button onclick="sendPredefinedMessage('Registration')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition active:scale-95 whitespace-nowrap">
                            📋 Registration
                        </button>
                        <button onclick="sendPredefinedMessage('Rules')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition active:scale-95 whitespace-nowrap">
                            📜 Rules & Discipline
                        </button>
                        <button onclick="sendPredefinedMessage('TodayTask')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition active:scale-95 whitespace-nowrap">
                            💻 Today's Work
                        </button>
                        <button onclick="sendPredefinedMessage('Logbook')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition active:scale-95 whitespace-nowrap">
                            📖 Logbook Status
                        </button>
                        <button onclick="sendPredefinedMessage('Certificate')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition active:scale-95 whitespace-nowrap">
                            🎓 Certificate Issue
                        </button>
                        <button onclick="sendPredefinedMessage('Leave')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition active:scale-95 whitespace-nowrap">
                            ✉️ Apply for Leave
                        </button>
                    </div>

                    <!-- INPUT FORM BAR -->
                    <form onsubmit="handleSendMessage(event)" class="p-2.5 sm:p-3 bg-white border-t border-slate-200 flex items-center gap-2 shrink-0">
                        <input type="text" id="messageInput" placeholder="Type message..." class="flex-1 bg-slate-100 border border-slate-200/90 focus:border-emerald-500 focus:bg-white rounded-2xl px-4 py-2.5 text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none transition">
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-md shadow-emerald-600/20 active:scale-95 transition shrink-0">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </form>

                </main>
            </div>
        </div>

    </div>

    <!-- SCRIPT DATA & LOGIC -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHhk4Eu4RPgy2dMrt4r4RxD7CI2lxDyHJsEinxYAPi-dJlNafCM97Jlkv-cbjbDxuwiA/exec";
        const TEACHER_PIN = "1998";

        let currentUser = null;
        let currentAuthRole = "student";
        let activeSelectedStudent = null;
        let localMessages = [];
        let localStudents = [];
        let syncInterval = null;

        // 10 COMPLETE CATEGORIES WITH ALL 110 FAQ MESSAGES AND IMPROVED TRAINED TEACHER RESPONSES
        const FAQ_CATEGORIES = [
            {
                category: "1. Registration & Joining",
                messages: [
                    "How can I register for the internship?",
                    "What documents are required?",
                    "How do I complete my registration?",
                    "How will I know if my registration is approved?",
                    "Can I edit my registration details?",
                    "Can I join without completing registration?",
                    "How can I check my registration status?",
                    "I haven't received my confirmation email. What should I do?",
                    "Can I change my registered email address?",
                    "Whom should I contact for registration problems?"
                ],
                reply: "Welcome! To complete registration, fill in your details on the official student portal and upload your College ID and Aadhaar card. Once submitted, your registration status will be verified within 24 hours."
            },
            {
                category: "2. Internship Timing & Schedule",
                messages: [
                    "What is the internship starting date?",
                    "What is the daily reporting time?",
                    "What are the working hours?",
                    "How many hours do we need to work daily?",
                    "Do we have a lunch break?",
                    "Are Saturdays and Sundays working days?",
                    "Will the schedule change?",
                    "How many days will the internship continue?",
                    "Should I arrive before the reporting time?",
                    "Where should I report after arriving?"
                ],
                reply: "The daily reporting time is 9:00 AM. Working hours are from 9:00 AM to 2:30 PM, Monday through Friday, including a lunch break. Please report directly to the practical lab on arrival."
            },
            {
                category: "3. Attendance & Leave",
                messages: [
                    "Is attendance compulsory?",
                    "Is 100% attendance required?",
                    "How will my attendance be recorded?",
                    "What happens if I arrive late?",
                    "Can I take leave during the internship?",
                    "How can I apply for leave?",
                    "What happens if I miss a day?",
                    "Can I complete missed work later?",
                    "Whom should I inform if I cannot attend?",
                    "Can I leave early with permission?"
                ],
                reply: "Yes, 100% attendance is strictly compulsory for receiving your certificate. If you need leave for an emergency, you must submit a written leave application in advance."
            },
            {
                category: "4. Training & Daily Work",
                messages: [
                    "What kind of work will I do?",
                    "Will practical training be provided?",
                    "Who will guide me during the internship?",
                    "Do I need previous work experience?",
                    "What should I do on my first day?",
                    "How will daily tasks be assigned?",
                    "Can I ask questions during training?",
                    "What if I cannot understand a task?",
                    "Can I use my own laptop?",
                    "Will I receive practical experience?"
                ],
                reply: "You will receive hands-on practical office and computer training. First observe the demonstration carefully, and then carry out your assigned task. Feel free to ask if you have any questions."
            },
            {
                category: "5. Rules & Discipline",
                messages: [
                    "Is formal dress compulsory?",
                    "What should I wear during the internship?",
                    "Is punctuality important?",
                    "Can I use my mobile phone during working hours?",
                    "How should I behave with office staff?",
                    "Can I leave the office without permission?",
                    "Can I bring my friends to the office?",
                    "Can I take photographs inside the office?",
                    "Are there any specific workplace rules?",
                    "What happens if I break an internship rule?"
                ],
                reply: "Maintain proper workplace discipline: wear proper formal dress, keep mobile phones on silent during lab hours, handle equipment carefully, and strictly adhere to office rules."
            },
            {
                category: "6. Assignments & Logbook",
                messages: [
                    "What is an internship logbook?",
                    "Is maintaining a logbook compulsory?",
                    "What should I write in my daily logbook?",
                    "When should I update my logbook?",
                    "When do I need to submit assignments?",
                    "How can I submit my assignments?",
                    "Can I submit my assignment late?",
                    "Will my assignments be evaluated?",
                    "Can I correct my mistakes after submission?",
                    "What happens if my logbook is incomplete?"
                ],
                reply: "Maintaining your daily logbook is mandatory. Record all your practical tasks and activities daily, and ensure it is checked and signed before you leave every afternoon."
            },
            {
                category: "7. Payment & Registration Fees",
                messages: [
                    "Is there any registration fee?",
                    "How can I make the payment?",
                    "Which payment methods are accepted?",
                    "Do I need to upload payment proof?",
                    "How can I check my payment status?",
                    "I have paid, but my status is still pending. What should I do?",
                    "Will I receive a payment receipt?",
                    "Can I pay through UPI?",
                    "What should I do if my payment fails?",
                    "Is the registration fee refundable?"
                ],
                reply: "Registration fees can be paid online via UPI or directly at the counter. Make sure to keep your transaction receipt or payment screenshot for account verification."
            },
            {
                category: "8. Certificate & Completion",
                messages: [
                    "Will I receive an internship certificate?",
                    "What are the requirements for receiving the certificate?",
                    "When will the certificate be distributed?",
                    "Will the certificate mention my internship duration?",
                    "Can I receive my certificate online?",
                    "Will my performance be evaluated?",
                    "What happens after completing the internship?",
                    "Can I receive my certificate if my attendance is incomplete?",
                    "Do I need to submit my final report?",
                    "Whom should I contact regarding my certificate?"
                ],
                reply: "Certificates will be distributed after the successful completion of the programme. You must complete assigned tasks, maintain 100% attendance, and submit an updated logbook."
            },
            {
                category: "9. Communication & Support",
                messages: [
                    "Whom should I contact if I have a problem?",
                    "Can I contact the teacher after working hours?",
                    "How will I receive important announcements?",
                    "Can I change my assigned department?",
                    "Can I request additional training?",
                    "What should I do if I face a technical problem?",
                    "How can I update my personal information?",
                    "Can I get an internship experience letter?",
                    "Can I share my internship experience on social media?",
                    "How can I provide feedback about the internship?"
                ],
                reply: "If you face any issues or technical difficulties, inform your coordinator or message here in this portal. All official updates and announcements will be shared here."
            },
            {
                category: "10. Daily Chat Messages",
                messages: [
                    "Good morning, Sir.", "Good afternoon, Sir.", "Good evening, Sir.", "Good night, Sir.",
                    "Are you available, Sir?", "Can I ask you something?", "What should I do today?",
                    "I have completed my work.", "I need your help, Sir.", "I don't understand this task.",
                    "I have made a mistake.", "I am unable to attend today.", "I will be late today.",
                    "I have submitted my assignment.", "Please check my work.", "Thank you for your guidance.",
                    "Sorry for the delay.", "See you tomorrow, Sir.", "Have a nice day, Sir.", "Goodbye, Sir."
                ],
                reply: "Good day! Please proceed with today's assigned practical tasks, double-check your work for accuracy, and remember to update your daily logbook."
            }
        ];

        // DYNAMIC TIME GREETING
        function getTimeBasedGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return "Good morning";
            if (hour >= 12 && hour < 17) return "Good afternoon";
            if (hour >= 17 && hour < 21) return "Good evening";
            return "Good night";
        }

        window.addEventListener('DOMContentLoaded', () => {
            populateTeacherCategoryDrawer();
            const savedUser = localStorage.getItem('school_chat_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initDashboard();
            } else {
                switchAuthTab('student');
            }
        });

        function switchAuthTab(role) {
            currentAuthRole = role;
            const tabStudent = document.getElementById('tabStudent');
            const tabTeacher = document.getElementById('tabTeacher');
            const nameGroup = document.getElementById('nameGroup');
            const pinLabel = document.getElementById('pinLabel');
            const authNotice = document.getElementById('authNotice');

            if (role === 'student') {
                tabStudent.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm";
                tabTeacher.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 text-slate-500";
                nameGroup.classList.remove('hidden');
                pinLabel.textContent = "4-Digit Security PIN";
                authNotice.classList.remove('hidden');
            } else {
                tabTeacher.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm";
                tabStudent.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 text-slate-500";
                nameGroup.classList.add('hidden');
                pinLabel.textContent = "Teacher Access PIN";
                authNotice.classList.add('hidden');
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const pin = document.getElementById('authPin').value.trim();

            if (currentAuthRole === 'teacher') {
                if (pin === TEACHER_PIN) {
                    currentUser = { name: "Teacher", role: "teacher" };
                    saveUserAndLaunch();
                } else {
                    alert("Incorrect Teacher PIN.");
                }
                return;
            }

            const name = document.getElementById('authName').value.trim();
            if (!name || pin.length < 4) {
                alert("Please enter full Name and 4-digit PIN.");
                return;
            }

            try {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "register", name: name, pin: pin })
                });
            } catch (err) {}

            currentUser = { name: name, role: "student" };
            saveUserAndLaunch();

            sendWelcomeAndGreeting(name);
        }

        function saveUserAndLaunch() {
            localStorage.setItem('school_chat_user', JSON.stringify(currentUser));
            initDashboard();
        }

        function sendWelcomeAndGreeting(studentName) {
            const welcomeKey = `welcome_sent_${studentName}`;
            if (!localStorage.getItem(welcomeKey)) {
                setTimeout(() => {
                    const greeting = getTimeBasedGreeting();
                    const welcomeText = `${greeting}, ${studentName}. Welcome to our internship programme! Is this your first internship? Don't worry, we will guide you throughout the programme. Please introduce yourself and let's start your training.`;
                    
                    const msgObj = {
                        timestamp: new Date().toISOString(),
                        sender: "Teacher",
                        receiver: studentName,
                        message: welcomeText,
                        senderRole: "teacher"
                    };
                    localMessages.push(msgObj);
                    renderMessages();
                    postMessageToSheet(msgObj);
                    localStorage.setItem(welcomeKey, "true");
                }, 800);
            }
        }

        function initDashboard() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');

            document.getElementById('navUserName').textContent = currentUser.name;
            document.getElementById('navUserRole').innerHTML = currentUser.role === 'teacher' 
                ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Teacher'
                : '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Student';

            document.getElementById('navRoleIcon').className = currentUser.role === 'teacher' ? 'fa-solid fa-chalkboard-user' : 'fa-solid fa-user-graduate';

            const teacherSidebar = document.getElementById('teacherSidebar');
            const predefinedChatBar = document.getElementById('predefinedChatBar');
            const mobileBackBtn = document.getElementById('mobileBackBtn');
            const teacherTemplatesBtn = document.getElementById('teacherTemplatesBtn');

            if (currentUser.role === 'teacher') {
                teacherSidebar.classList.remove('hidden');
                predefinedChatBar.classList.add('hidden');
                mobileBackBtn.classList.remove('hidden');
                teacherTemplatesBtn.classList.remove('hidden');
                document.getElementById('chatHeaderTitle').textContent = "Select Student";
                document.getElementById('chatHeaderSubtitle').textContent = "Tap student list on top left";
            } else {
                teacherSidebar.classList.add('hidden');
                predefinedChatBar.classList.remove('hidden');
                mobileBackBtn.classList.add('hidden');
                teacherTemplatesBtn.classList.add('hidden');
                document.getElementById('chatHeaderTitle').textContent = "Teacher";
                document.getElementById('chatHeaderSubtitle').textContent = "Online | Direct Channel";
            }

            loadRemoteData();
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(loadRemoteData, 5000);
        }

        function handleLogout() {
            if (confirm("Log out from portal?")) {
                localStorage.removeItem('school_chat_user');
                currentUser = null;
                if (syncInterval) clearInterval(syncInterval);
                location.reload();
            }
        }

        async function loadRemoteData() {
            updateSyncStatus('Syncing...');
            try {
                const resMsgs = await fetch(`${APPS_SCRIPT_URL}?action=getMessages`);
                const msgsData = await resMsgs.json();
                if (Array.isArray(msgsData)) localMessages = msgsData;

                if (currentUser.role === 'teacher') {
                    const resUsers = await fetch(`${APPS_SCRIPT_URL}?action=getUsers`);
                    const usersData = await resUsers.json();
                    if (Array.isArray(usersData)) {
                        localStudents = usersData.filter(u => u.role !== 'Teacher');
                        renderStudentList();
                    }
                }

                updateSyncStatus('Connected');
                renderMessages();
            } catch (err) {
                updateSyncStatus('Offline');
                renderMessages();
            }
        }

        function renderStudentList() {
            const container = document.getElementById('studentListContainer');
            if (!container) return;

            if (localStudents.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No students registered yet.</div>`;
                return;
            }

            container.innerHTML = localStudents.map(student => {
                const isActive = activeSelectedStudent === student.name;
                return `
                    <div onclick="selectStudent('${student.name}')" class="p-3 rounded-xl cursor-pointer transition flex items-center justify-between ${isActive ? 'bg-emerald-600 text-white font-medium shadow-sm' : 'bg-slate-100 hover:bg-slate-200/80 text-slate-700'}">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full ${isActive ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-700'} flex items-center justify-center text-xs">
                                <i class="fa-solid fa-user-graduate"></i>
                            </div>
                            <span class="text-xs font-semibold truncate max-w-[130px]">${student.name}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] opacity-60"></i>
                    </div>
                `;
            }).join('');
        }

        function selectStudent(studentName) {
            activeSelectedStudent = studentName;
            document.getElementById('chatHeaderTitle').textContent = studentName;
            document.getElementById('chatHeaderSubtitle').textContent = "Student Chat History";
            document.getElementById('chatHeaderIcon').className = "fa-solid fa-user-graduate";
            
            if (window.innerWidth < 640) {
                document.getElementById('teacherSidebar').classList.add('hidden');
            }

            renderStudentList();
            renderMessages();
        }

        function populateTeacherCategoryDrawer() {
            const container = document.getElementById('teacherCategoryButtons');
            if (!container) return;

            container.innerHTML = FAQ_CATEGORIES.map((cat, idx) => `
                <div class="bg-white p-2.5 rounded-xl border border-emerald-200/60 shadow-2xs">
                    <div class="text-[11px] font-bold text-emerald-800 mb-1">${cat.category}</div>
                    <div class="flex flex-wrap gap-1.5">
                        ${cat.messages.map(m => `
                            <button onclick="teacherQuickSend('${m.replace(/'/g, "\\'")}')" class="px-2.5 py-1 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-lg text-[10px] text-slate-700 transition">
                                ${m}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function toggleTeacherQuickDrawer() {
            const drawer = document.getElementById('teacherQuickDrawer');
            drawer.classList.toggle('hidden');
        }

        function teacherQuickSend(msgText) {
            if (!activeSelectedStudent) {
                alert("Please select a student from sidebar first.");
                return;
            }
            document.getElementById('messageInput').value = msgText;
            handleSendMessage(new Event('submit'));
        }

        function formatTime(isoString) {
            if (!isoString) return "";
            const date = new Date(isoString);
            if (isNaN(date.getTime())) return "";
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function formatDateHeader(isoString) {
            if (!isoString) return "";
            const date = new Date(isoString);
            if (isNaN(date.getTime())) return "";
            const today = new Date();
            if (date.toDateString() === today.toDateString()) return "Today";
            return date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            if (!container) return;

            let filtered = [];

            if (currentUser.role === 'student') {
                filtered = localMessages.filter(m => m.sender === currentUser.name || m.receiver === currentUser.name);
            } else {
                if (!activeSelectedStudent) {
                    container.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs text-center p-4">
                            <i class="fa-solid fa-comments text-3xl mb-2 text-slate-300"></i>
                            Select a student from the sidebar to start chatting.
                        </div>
                    `;
                    return;
                }
                filtered = localMessages.filter(m => m.sender === activeSelectedStudent || m.receiver === activeSelectedStudent);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs text-center p-4">
                        <i class="fa-regular fa-paper-plane text-2xl mb-2 text-slate-300"></i>
                        No chat history. Type your message below!
                    </div>
                `;
                return;
            }

            let html = "";
            let lastDateStr = "";

            filtered.forEach(m => {
                const isMe = m.sender === currentUser.name;
                const msgDateStr = formatDateHeader(m.timestamp);
                const msgTimeStr = formatTime(m.timestamp);

                if (msgDateStr && msgDateStr !== lastDateStr) {
                    lastDateStr = msgDateStr;
                    html += `
                        <div class="flex justify-center my-2">
                            <span class="bg-slate-200/80 text-slate-600 text-[10px] font-semibold px-2.5 py-0.5 rounded-full shadow-2xs">${msgDateStr}</span>
                        </div>
                    `;
                }

                html += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1">
                        <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl px-3.5 py-2 text-xs sm:text-sm leading-snug ${
                            isMe 
                            ? 'bg-emerald-600 text-white rounded-br-none shadow-xs' 
                            : 'bg-white text-slate-800 border border-slate-200/80 rounded-bl-none shadow-xs'
                        }">
                            <div class="text-[10px] font-bold ${isMe ? 'text-emerald-100' : 'text-emerald-700'} mb-0.5 flex justify-between gap-3">
                                <span>${m.sender}</span>
                            </div>
                            <div>${m.message}</div>
                            <div class="text-[9px] text-right mt-1 opacity-70 font-medium">${msgTimeStr}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (currentUser.role === 'teacher' && !activeSelectedStudent) {
                alert("Select a student to message first.");
                return;
            }

            const receiver = currentUser.role === 'student' ? 'Teacher' : activeSelectedStudent;

            const newMsg = {
                timestamp: new Date().toISOString(),
                sender: currentUser.name,
                receiver: receiver,
                message: text,
                senderRole: currentUser.role
            };

            localMessages.push(newMsg);
            renderMessages();
            input.value = "";

            postMessageToSheet(newMsg);

            if (currentUser.role === 'student') {
                checkAndSendBotReply(text);
            }
        }

        function sendPredefinedMessage(type) {
            const timeGreeting = getTimeBasedGreeting();
            let text = "";
            if (type === 'Registration') text = `${timeGreeting}, Sir. How can I check my registration status?`;
            if (type === 'Rules') text = `${timeGreeting}, Sir. Could you please explain the internship rules?`;
            if (type === 'TodayTask') text = `${timeGreeting}, Sir. What should I do today?`;
            if (type === 'Logbook') text = `${timeGreeting}, Sir. Do we need to maintain a daily report logbook?`;
            if (type === 'Certificate') text = `${timeGreeting}, Sir. When will we receive our internship certificates?`;
            if (type === 'Leave') text = `${timeGreeting}, Sir. I will not be able to attend tomorrow due to personal work. How do I apply for leave?`;

            document.getElementById('messageInput').value = text;
            handleSendMessage(new Event('submit'));
        }

        function checkAndSendBotReply(studentMessage) {
            const msgLower = studentMessage.toLowerCase();
            let botResponse = null;

            for (const cat of FAQ_CATEGORIES) {
                for (const m of cat.messages) {
                    if (msgLower.includes(m.toLowerCase().replace('?', '')) || msgLower.includes(cat.category.toLowerCase().split(' ')[1])) {
                        botResponse = cat.reply;
                        break;
                    }
                }
                if (botResponse) break;
            }

            if (!botResponse) {
                const greeting = getTimeBasedGreeting();
                botResponse = `${greeting}! I have received your message. Please follow your assigned task, maintain your daily logbook, and let me know if you face any difficulty.`;
            }

            setTimeout(() => {
                const replyObj = {
                    timestamp: new Date().toISOString(),
                    sender: "Teacher",
                    receiver: currentUser.name,
                    message: botResponse,
                    senderRole: "teacher"
                };
                localMessages.push(replyObj);
                renderMessages();
                postMessageToSheet(replyObj);
            }, 1000);
        }

        function postMessageToSheet(msgData) {
            updateSyncStatus('Syncing...');
            try {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "sendMessage",
                        sender: msgData.sender,
                        receiver: msgData.receiver,
                        message: msgData.message,
                        senderRole: msgData.senderRole
                    })
                }).then(() => updateSyncStatus('Connected'))
                  .catch(() => updateSyncStatus('Saved locally'));
            } catch (err) {
                updateSyncStatus('Saved locally');
            }
        }

        function updateSyncStatus(text) {
            const badge = document.getElementById('syncText');
            if (badge) badge.textContent = text;
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('teacherSidebar');
            sidebar.classList.toggle('hidden');
        }
    </script>
</body>
</html>
