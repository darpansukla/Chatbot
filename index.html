<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Messaging Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e6f4ea 50%, #f4fbf7 100%);
        }
        .apple-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .apple-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-center items-center p-2 sm:p-4 md:p-6 select-none overflow-x-hidden">

    <!-- APPLE LIGHT BACKGROUND BLUR ORBS -->
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-emerald-200/40 rounded-full blur-[130px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-teal-200/30 rounded-full blur-[130px] pointer-events-none"></div>

    <!-- MAIN APP WRAPPER -->
    <div class="w-full max-w-6xl h-[94vh] max-h-[860px] apple-glass rounded-[32px] shadow-2xl shadow-emerald-950/5 overflow-hidden flex flex-col relative z-10 transition-all duration-300">

        <!-- AUTH SCREEN (LOGIN / REGISTER) -->
        <div id="authScreen" class="flex-1 flex items-center justify-center p-4 sm:p-8">
            <div class="w-full max-w-md apple-card p-8 rounded-[28px] relative overflow-hidden">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-emerald-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-emerald-500/25 transition-transform hover:scale-105 duration-200">
                        <i class="fa-solid fa-graduation-cap text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">School Portal</h2>
                    <p class="text-xs font-medium text-slate-500 mt-1">Connect directly with your Teacher</p>
                </div>

                <!-- Role Selector Tabs -->
                <div class="flex bg-slate-100 p-1 rounded-2xl mb-6 border border-slate-200/60">
                    <button id="tabStudent" onclick="switchAuthTab('student')" class="flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm">
                        <i class="fa-solid fa-user-graduate mr-1.5"></i> Student
                    </button>
                    <button id="tabTeacher" onclick="switchAuthTab('teacher')" class="flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800">
                        <i class="fa-solid fa-chalkboard-user mr-1.5"></i> Teacher
                    </button>
                </div>

                <!-- Form -->
                <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    <div id="nameGroup">
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">Full Name</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="authName" placeholder="Enter your full name" class="w-full bg-slate-50/80 border border-slate-200 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 rounded-2xl pl-11 pr-4 py-3 text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none transition duration-200">
                        </div>
                    </div>

                    <div>
                        <label id="pinLabel" class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">4-Digit PIN</label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="password" id="authPin" maxlength="4" placeholder="••••" class="w-full bg-slate-50/80 border border-slate-200 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 rounded-2xl pl-11 pr-4 py-3 text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none tracking-widest transition duration-200">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/20 active:scale-[0.98] transition duration-200 text-xs sm:text-sm mt-3 flex items-center justify-center gap-2">
                        <span>Continue</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <div id="authNotice" class="mt-4 text-center text-[11px] text-slate-400 font-medium">
                    New students are automatically registered on first sign-in.
                </div>
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="mainDashboard" class="flex-1 flex flex-col hidden h-full overflow-hidden">
            
            <!-- TOP NAVBAR -->
            <header class="h-16 border-b border-slate-200/80 bg-white/70 px-4 sm:px-6 flex items-center justify-between backdrop-blur-xl">
                
                <!-- LEFT HAND SIDE: BIG SHUTDOWN / LOGOUT BUTTON -->
                <div class="flex items-center gap-3">
                    <button onclick="handleLogout()" title="Log Out" class="w-11 h-11 rounded-2xl bg-red-50 hover:bg-red-500 hover:text-white border border-red-200/80 text-red-500 flex items-center justify-center shadow-sm transition-all duration-200 active:scale-90 group shrink-0">
                        <i class="fa-solid fa-power-off text-lg group-hover:rotate-12 transition-transform duration-200"></i>
                    </button>
                    <div class="h-6 w-[1px] bg-slate-200"></div>
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl bg-emerald-50 border border-emerald-200/60 flex items-center justify-center text-emerald-600">
                            <i id="navRoleIcon" class="fa-solid fa-user-graduate text-xs"></i>
                        </div>
                        <div>
                            <h1 id="navUserName" class="text-xs sm:text-sm font-bold text-slate-900 leading-none">User Name</h1>
                            <p id="navUserRole" class="text-[10px] font-medium text-slate-500 mt-1 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
                                Student
                            </p>
                        </div>
                    </div>
                </div>

                <!-- RIGHT SIDE: STATUS -->
                <div id="syncBadge" class="px-3 py-1 rounded-full bg-slate-100/80 border border-slate-200/60 text-[11px] font-medium text-slate-500 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="syncText">Synced</span>
                </div>
            </header>

            <!-- CHAT WORKSPACE BODY -->
            <div class="flex-1 flex overflow-hidden relative">

                <!-- SIDEBAR (FOR TEACHER TO SELECT STUDENTS) -->
                <aside id="teacherSidebar" class="w-full sm:w-72 md:w-80 border-r border-slate-200/80 bg-slate-50/50 flex flex-col hidden sm:flex">
                    <div class="p-3.5 border-b border-slate-200/80 bg-white/50 flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-users text-emerald-600"></i> Students List
                        </span>
                        <button onclick="loadRemoteData()" title="Refresh" class="text-slate-400 hover:text-slate-700 text-xs p-1">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>

                    <div id="studentListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-2.5 space-y-1.5">
                        <!-- Student Item Template -->
                    </div>
                </aside>

                <!-- CHAT PANEL -->
                <main class="flex-1 flex flex-col bg-white/40 relative">
                    
                    <!-- Chat Header -->
                    <div id="chatHeader" class="p-3.5 px-4 sm:px-6 border-b border-slate-200/80 bg-white/60 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <button id="mobileBackBtn" onclick="toggleMobileSidebar()" class="sm:hidden text-slate-500 hover:text-slate-800 mr-1 hidden">
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>
                            <div class="w-9 h-9 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm font-semibold border border-emerald-200/60">
                                <i id="chatHeaderIcon" class="fa-solid fa-chalkboard-user"></i>
                            </div>
                            <div>
                                <h3 id="chatHeaderTitle" class="text-xs sm:text-sm font-bold text-slate-900">Teacher</h3>
                                <p id="chatHeaderSubtitle" class="text-[10px] text-slate-500 font-medium">Direct messages</p>
                            </div>
                        </div>
                    </div>

                    <!-- Messages Display -->
                    <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3.5 custom-scrollbar">
                        <!-- Chat history renders here -->
                    </div>

                    <!-- PREDEFINED QUICK ASK BAR (FOR STUDENTS) -->
                    <div id="predefinedChatBar" class="p-2 sm:p-2.5 px-4 border-t border-slate-200/60 bg-white/80 overflow-x-auto flex items-center gap-2 custom-scrollbar">
                        <span class="text-[11px] font-bold text-emerald-700 whitespace-nowrap flex items-center gap-1 mr-1">
                            <i class="fa-solid fa-bolt"></i> Quick Ask:
                        </span>
                        <button onclick="sendPredefinedMessage('Syllabus')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition duration-150 whitespace-nowrap active:scale-95 shadow-sm">
                            📚 Exam Syllabus
                        </button>
                        <button onclick="sendPredefinedMessage('Assignment')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition duration-150 whitespace-nowrap active:scale-95 shadow-sm">
                            📝 Homework Assignment
                        </button>
                        <button onclick="sendPredefinedMessage('Timings')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition duration-150 whitespace-nowrap active:scale-95 shadow-sm">
                            ⏰ Class Timings
                        </button>
                        <button onclick="sendPredefinedMessage('Notes')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:border-emerald-300 border border-slate-200 text-slate-700 hover:text-emerald-700 text-xs font-medium transition duration-150 whitespace-nowrap active:scale-95 shadow-sm">
                            📄 Chapter Notes
                        </button>
                    </div>

                    <!-- Input Box -->
                    <form onsubmit="handleSendMessage(event)" class="p-3 sm:p-4 bg-white/90 border-t border-slate-200/80 flex items-center gap-2">
                        <input type="text" id="messageInput" placeholder="Type your message here..." class="flex-1 bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 rounded-2xl px-4 py-3 text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none transition duration-200">
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white w-11 h-11 rounded-2xl flex items-center justify-center shadow-md shadow-emerald-600/20 transition active:scale-95 shrink-0">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </form>

                </main>
            </div>
        </div>

    </div>

    <!-- SCRIPT -->
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHhk4Eu4RPgy2dMrt4r4RxD7CI2lxDyHJsEinxYAPi-dJlNafCM97Jlkv-cbjbDxuwiA/exec";
        const TEACHER_PIN = "1998";

        let currentUser = null;
        let currentAuthRole = "student";
        let activeSelectedStudent = null;
        let localMessages = [];
        let localStudents = [];
        let syncInterval = null;

        const PREDEFINED_REPLIES = {
            "syllabus": "📘 The exam syllabus covers Chapters 1 to 5. Review exercises at the end of each chapter.",
            "assignment": "📝 Homework: Solve Problem Set 3 on page 42. Submission deadline is Friday 4:00 PM.",
            "timings": "⏰ Class Timings: Monday to Friday, 9:00 AM to 2:30 PM.",
            "notes": "📄 Printed chapter notes are available in the staff room or can be shared digitally."
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('school_chat_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initDashboard();
            } else {
                switchAuthTab('student');
            }
        });

        function switchAuthTab(role) {
            currentAuthRole = role;
            const tabStudent = document.getElementById('tabStudent');
            const tabTeacher = document.getElementById('tabTeacher');
            const nameGroup = document.getElementById('nameGroup');
            const pinLabel = document.getElementById('pinLabel');
            const authNotice = document.getElementById('authNotice');

            if (role === 'student') {
                tabStudent.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm";
                tabTeacher.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800";
                nameGroup.classList.remove('hidden');
                pinLabel.textContent = "4-Digit PIN";
                authNotice.classList.remove('hidden');
            } else {
                tabTeacher.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm";
                tabStudent.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800";
                nameGroup.classList.add('hidden');
                pinLabel.textContent = "Teacher Access PIN";
                authNotice.classList.add('hidden');
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const pin = document.getElementById('authPin').value.trim();

            if (currentAuthRole === 'teacher') {
                if (pin === TEACHER_PIN) {
                    currentUser = { name: "Teacher", role: "teacher" };
                    saveUserAndLaunch();
                } else {
                    alert("Incorrect Teacher PIN.");
                }
                return;
            }

            const name = document.getElementById('authName').value.trim();
            if (!name || pin.length < 4) {
                alert("Please enter a valid Name and 4-Digit PIN.");
                return;
            }

            try {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "register", name: name, pin: pin })
                });
            } catch (err) {}

            currentUser = { name: name, role: "student" };
            saveUserAndLaunch();
        }

        function saveUserAndLaunch() {
            localStorage.setItem('school_chat_user', JSON.stringify(currentUser));
            initDashboard();
        }

        function initDashboard() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');

            document.getElementById('navUserName').textContent = currentUser.name;
            document.getElementById('navUserRole').innerHTML = currentUser.role === 'teacher' 
                ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Teacher'
                : '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Student';

            document.getElementById('navRoleIcon').className = currentUser.role === 'teacher' ? 'fa-solid fa-chalkboard-user' : 'fa-solid fa-user-graduate';

            const teacherSidebar = document.getElementById('teacherSidebar');
            const predefinedChatBar = document.getElementById('predefinedChatBar');

            if (currentUser.role === 'teacher') {
                teacherSidebar.classList.remove('hidden');
                predefinedChatBar.classList.add('hidden');
                document.getElementById('chatHeaderTitle').textContent = "Select a Student";
                document.getElementById('chatHeaderSubtitle').textContent = "Choose a student from the sidebar";
            } else {
                teacherSidebar.classList.add('hidden');
                predefinedChatBar.classList.remove('hidden');
                document.getElementById('chatHeaderTitle').textContent = "Teacher";
                document.getElementById('chatHeaderSubtitle').textContent = "Direct message window";
            }

            loadRemoteData();
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(loadRemoteData, 5000);
        }

        function handleLogout() {
            if (confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('school_chat_user');
                currentUser = null;
                if (syncInterval) clearInterval(syncInterval);
                location.reload();
            }
        }

        async function loadRemoteData() {
            updateSyncStatus('Syncing...');
            try {
                const resMsgs = await fetch(`${APPS_SCRIPT_URL}?action=getMessages`);
                const msgsData = await resMsgs.json();
                if (Array.isArray(msgsData)) localMessages = msgsData;

                if (currentUser.role === 'teacher') {
                    const resUsers = await fetch(`${APPS_SCRIPT_URL}?action=getUsers`);
                    const usersData = await resUsers.json();
                    if (Array.isArray(usersData)) {
                        localStudents = usersData.filter(u => u.role !== 'Teacher');
                        renderStudentList();
                    }
                }

                updateSyncStatus('Synced');
                renderMessages();
            } catch (err) {
                updateSyncStatus('Offline');
                renderMessages();
            }
        }

        function renderStudentList() {
            const container = document.getElementById('studentListContainer');
            if (!container) return;

            if (localStudents.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No registered students yet.</div>`;
                return;
            }

            container.innerHTML = localStudents.map(student => {
                const isActive = activeSelectedStudent === student.name;
                return `
                    <div onclick="selectStudent('${student.name}')" class="p-3 rounded-2xl cursor-pointer transition flex items-center justify-between ${isActive ? 'bg-emerald-600 text-white font-semibold shadow-md shadow-emerald-600/20' : 'bg-white hover:bg-emerald-50/60 text-slate-700 border border-slate-200/60'}">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-xl ${isActive ? 'bg-white/20 text-white' : 'bg-emerald-50 text-emerald-600'} flex items-center justify-center text-xs">
                                <i class="fa-solid fa-user-graduate"></i>
                            </div>
                            <span class="text-xs truncate max-w-[130px]">${student.name}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] opacity-60"></i>
                    </div>
                `;
            }).join('');
        }

        function selectStudent(studentName) {
            activeSelectedStudent = studentName;
            document.getElementById('chatHeaderTitle').textContent = studentName;
            document.getElementById('chatHeaderSubtitle').textContent = "Student Direct Line";
            document.getElementById('chatHeaderIcon').className = "fa-solid fa-user-graduate";
            renderStudentList();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            if (!container) return;

            let filtered = [];

            if (currentUser.role === 'student') {
                filtered = localMessages.filter(m => m.sender === currentUser.name || m.receiver === currentUser.name);
            } else {
                if (!activeSelectedStudent) {
                    container.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs">
                            <i class="fa-solid fa-comments text-3xl mb-2 text-slate-300"></i>
                            Select a student from the sidebar to view messages.
                        </div>
                    `;
                    return;
                }
                filtered = localMessages.filter(m => m.sender === activeSelectedStudent || m.receiver === activeSelectedStudent);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs">
                        <i class="fa-regular fa-paper-plane text-2xl mb-2 text-slate-300"></i>
                        No messages yet. Send a message to start!
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(m => {
                const isMe = m.sender === currentUser.name;
                return `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                        <div class="max-w-[80%] sm:max-w-[70%] rounded-2xl px-4 py-2.5 text-xs sm:text-sm leading-relaxed ${
                            isMe 
                            ? 'bg-emerald-600 text-white rounded-br-none shadow-sm' 
                            : 'bg-white text-slate-800 border border-slate-200/80 rounded-bl-none shadow-sm'
                        }">
                            <div class="text-[10px] font-semibold ${isMe ? 'text-emerald-100' : 'text-emerald-700'} mb-1">${m.sender}</div>
                            <div>${m.message}</div>
                        </div>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (currentUser.role === 'teacher' && !activeSelectedStudent) {
                alert("Please select a student to message first.");
                return;
            }

            const receiver = currentUser.role === 'student' ? 'Teacher' : activeSelectedStudent;

            const newMsg = {
                timestamp: new Date().toISOString(),
                sender: currentUser.name,
                receiver: receiver,
                message: text,
                senderRole: currentUser.role
            };

            localMessages.push(newMsg);
            renderMessages();
            input.value = "";

            postMessageToSheet(newMsg);

            if (currentUser.role === 'student') {
                checkAndSendBotReply(text);
            }
        }

        function sendPredefinedMessage(type) {
            let text = "";
            if (type === 'Syllabus') text = "Can you share the exam syllabus?";
            if (type === 'Assignment') text = "What is today's homework assignment?";
            if (type === 'Timings') text = "What are the class timings?";
            if (type === 'Notes') text = "Where can I get the chapter notes?";

            document.getElementById('messageInput').value = text;
            handleSendMessage(new Event('submit'));
        }

        function checkAndSendBotReply(studentMessage) {
            const msgLower = studentMessage.toLowerCase();
            let botResponse = null;

            if (msgLower.includes('syllabus') || msgLower.includes('exam')) {
                botResponse = PREDEFINED_REPLIES["syllabus"];
            } else if (msgLower.includes('assignment') || msgLower.includes('homework')) {
                botResponse = PREDEFINED_REPLIES["assignment"];
            } else if (msgLower.includes('timing') || msgLower.includes('time') || msgLower.includes('class')) {
                botResponse = PREDEFINED_REPLIES["timings"];
            } else if (msgLower.includes('note') || msgLower.includes('pdf') || msgLower.includes('chapter')) {
                botResponse = PREDEFINED_REPLIES["notes"];
            }

            if (botResponse) {
                setTimeout(() => {
                    const replyObj = {
                        timestamp: new Date().toISOString(),
                        sender: "Teacher (Auto-Response)",
                        receiver: currentUser.name,
                        message: botResponse,
                        senderRole: "teacher"
                    };
                    localMessages.push(replyObj);
                    renderMessages();
                    postMessageToSheet(replyObj);
                }, 700);
            }
        }

        function postMessageToSheet(msgData) {
            updateSyncStatus('Syncing...');
            try {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "sendMessage",
                        sender: msgData.sender,
                        receiver: msgData.receiver,
                        message: msgData.message,
                        senderRole: msgData.senderRole
                    })
                }).then(() => updateSyncStatus('Synced'))
                  .catch(() => updateSyncStatus('Saved locally'));
            } catch (err) {
                updateSyncStatus('Saved locally');
            }
        }

        function updateSyncStatus(text) {
            const badge = document.getElementById('syncText');
            if (badge) badge.textContent = text;
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('teacherSidebar');
            sidebar.classList.toggle('hidden');
        }
    </script>
</body>
</html>
